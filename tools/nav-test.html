<!DOCTYPE html><html><head><meta charset="utf-8"><title>Navigationstest</title></head>
<body style="background:#000;color:#eee;font:13px ui-monospace,Menlo,monospace;padding:16px">
<pre id="out">läuft …</pre>
<audio id="player"></audio>
<script type="module">
import * as N from '../js/nav.js';
import { nav } from '../js/nav.js';
import * as POI from '../js/poi.js';

const out = document.getElementById('out'); const L = [];
const spoken = [];
if (window.speechSynthesis) speechSynthesis.speak = (u) => spoken.push(u.text);

(async () => {
  const from = { lat: 50.3350, lon: 6.9470 };

  L.push('— Route berechnen —');
  await N.calculate(from, 'Adenau');
  L.push(`Status: ${nav.state}  ${nav.error || ''}`);
  if (nav.state !== 'planned') { out.textContent = L.join('\n'); return; }
  L.push(`Ziel: ${nav.dest.name}`);
  nav.routes.forEach((r, i) => L.push(`  Route ${i + 1}: ${(r.length / 1000).toFixed(1)} km, ${Math.round(r.time / 60)} min, ${r.maneuvers.length} Manöver`));

  L.push('— Alternative wählen —');
  if (nav.routes.length > 1) {
    N.chooseRoute(1);
    L.push(`  gewählt: ${nav.selected + 1}, Länge jetzt ${(nav.remainingM / 1000).toFixed(1)} km`);
    N.chooseRoute(0);
  }

  L.push('— Führung starten und abfahren —');
  N.begin();
  L.push(`  Status: ${nav.state}`);
  const pts = nav.shape;
  [0, .25, .6, .95].forEach((f) => {
    const [la, lo] = pts[Math.floor(f * (pts.length - 1))];
    N.update(la, lo, 22);
    L.push(`   Rest ${N.fmtKm(nav.remainingM)}, Manöver in ${N.fmtKm(nav.distToTurn)}, Abstand ${nav.offRouteM.toFixed(1)} m`);
  });

  L.push('— Abseits der Route —');
  const mid = pts[Math.floor(pts.length / 2)];
  for (let i = 0; i < 3; i++) N.update(mid[0] + 0.0035, mid[1] + 0.0035, 22);
  L.push(`  Status: ${nav.state}, Abstand ${nav.offRouteM.toFixed(0)} m`);

  L.push('— POI in der Nähe —');
  try {
    const list = await POI.search('fuel', from);
    list.slice(0, 3).forEach((p) => L.push(`  ${p.name} — ${N.fmtKm(p.dist)}`));
  } catch (e) { L.push('  Fehler: ' + e.message); }

  L.push(`— Ansagen: ${spoken.length} —`);
  spoken.slice(0, 5).forEach((t) => L.push('  • ' + t));
  out.textContent = L.join('\n');
})();
</script></body></html>
